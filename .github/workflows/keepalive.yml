name: Keep Render awake

# Render 무료 인스턴스는 15분 유휴 시 슬립하고, 다시 깨어나는 데 약 163초 걸린다.
# 데모 링크를 누른 사람이 3분을 기다리지 않도록 주기적으로 깨워둔다.
#
on:
  schedule:
    # 14분마다 — Render의 15분 슬립 임계보다 짧게 잡는다.
    - cron: '*/14 * * * *'
  workflow_dispatch: # 수동 실행용 (배포 직후 깨우기)

# 이전 실행이 밀려 있으면 중복 핑을 보내지 않는다.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: |
          # 슬립 상태면 응답까지 3분 가까이 걸리므로 넉넉히 기다린다.
          # 인증이 필요 없는 경로여야 한다 (SecurityConfig의 permitAll 목록).
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 240 --retry 2 --retry-delay 30 \
                   https://ims-rt9g.onrender.com/swagger-ui.html)
          echo "HTTP $code"
          # 3xx는 swagger-ui의 정상 리다이렉트다.
          if [ "$code" -ge 400 ]; then
            echo "::error::Backend responded with $code"
            exit 1
          fi
