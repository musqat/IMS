name: keepalive

# Render 무료 플랜은 15분 놀면 인스턴스를 내린다. 다시 깨우는 데 1~3분이 걸려
# 링크를 처음 여는 사람이 흰 화면을 보게 된다. 주기적으로 깨워둔다.
#
# 깨우는 일은 cron-job.org(`*/10 0,8-23` KST)가 맡는다. 이쪽은 보조다.
# GitHub 예약 실행은 정시 보장이 아니다 — 실행 300건을 재보니 창 안 간격 중앙값이
# 38.7분으로 15분 유휴 기준을 96% 넘겼다. `*/5`로 적어도 그대로 돌지 않는다.
#
# 한계 두 가지
# - 예약 워크플로는 저장소가 60일간 조용하면 자동으로 꺼진다. 커밋이 끊기면 같이 멈춘다
# - 창 밖(야간·주말)에는 인스턴스가 내려간다. 그 시간에 처음 들어온 사람은
#   1~3분을 기다린다. 창을 넓히려면 아래 cron의 시간·요일 범위를 늘리면 된다

on:
  schedule:
    # 평일 06:00~19:00 KST. cron은 UTC라 KST 06시가 전날 21시 UTC가 되어 두 줄로 갈린다.
    # 21~23시 UTC 일~목  =  06:00~08:55 KST 월~금
    - cron: '*/5 21-23 * * 0-4'
    # 00~10시 UTC 월~금  =  09:00~19:55 KST 월~금
    - cron: '*/5 0-10 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 백엔드 깨우기
        run: |
          if [ -z "${{ vars.BACKEND_URL }}" ]; then
            echo "BACKEND_URL 저장소 변수가 없습니다. Settings > Secrets and variables > Actions > Variables에 등록하세요."
            exit 1
          fi

          # --retry는 5xx와 연결 실패에 붙는다
          # 타임아웃 시 curl 종료 코드가 0이 아니므로 000으로 대체
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 180 \
                   --retry 3 --retry-delay 20 --retry-connrefused \
                   "${{ vars.BACKEND_URL }}/api/v1/health") || code=000

          echo "health -> $code"
          echo "health -> $code" >> "$GITHUB_STEP_SUMMARY"

          # 상태 코드로 잡을 실패시키지 않음 — 장애 알림은 cron-job.org 담당
