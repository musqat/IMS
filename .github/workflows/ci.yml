name: CI

# PR과 main 푸시에서 테스트·빌드를 돌린다.
# 로컬에서만 확인하던 것을 기록으로 남기는 게 목적이다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다.
# 어차피 최신 커밋 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    # 동시성 테스트용 Postgres.
    # 검증 대상이 비관적 락인데 H2는 락 의미론이 달라 락을 떼도 통과할 수 있다.
    # 로컬에서는 Docker Desktop과 Testcontainers가 안 맞아 컨테이너를 직접 띄웠는데,
    # 여기서는 리눅스 러너라 services로 간단히 붙는다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ims
          POSTGRES_USER: ims
          POSTGRES_PASSWORD: ims
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U ims -d ims"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 테스트 (H2)
        working-directory: backend
        run: ./gradlew test

      - name: 커버리지 게이트 (LINE 90% / BRANCH 80%)
        working-directory: backend
        run: ./gradlew jacocoTestCoverageVerification

      - name: 동시성 테스트 (실제 Postgres)
        working-directory: backend
        run: ./gradlew concurrencyTestPg

      # 실패했을 때 로그만 보고 원인을 찾기 어렵다. 리포트를 받아둔다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # next build가 tsc를 포함한다. 타입 오류도 여기서 잡힌다
      - name: 빌드
        working-directory: frontend
        run: npm run build

  # e2e 테스트
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ims
          POSTGRES_USER: ims
          POSTGRES_PASSWORD: ims
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ims -d ims"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # bootRun 대신 jar로 띄운다. gradle 데몬이 남지 않는다
      - name: 백엔드 빌드
        working-directory: backend
        run: ./gradlew bootJar -x test

      # DB·Redis·CORS는 application.yml 기본값이 서비스 컨테이너와 그대로 맞는다.
      # JWT_SECRET만 주면 된다
      - name: 백엔드 실행
        working-directory: backend
        env:
          JWT_SECRET: ci-only-secret-key-not-for-deploy-0123456789
        run: |
          nohup java -jar build/libs/*.jar > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: 백엔드 기동 대기
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              echo "기동 완료 (${i}회 시도)"
              exit 0
            fi
            sleep 2
          done
          echo "기동 실패 — 백엔드 로그:"
          tail -50 /tmp/backend.log
          exit 1

      - name: 프론트 의존성
        working-directory: frontend
        run: npm ci

      - name: 프론트 빌드
        working-directory: frontend
        run: npm run build

      # --with-deps로 우분투 시스템 라이브러리까지 설치한다
      - name: Playwright 브라우저
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        run: npm run e2e

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      #  로그용
      - name: 실패 시 백엔드 로그
        if: failure()
        run: tail -200 /tmp/backend.log
