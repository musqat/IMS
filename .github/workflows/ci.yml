name: CI

# PR과 main 푸시에서 테스트·빌드를 돌린다.
# 로컬에서만 확인하던 것을 기록으로 남기는 게 목적이다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다.
# 어차피 최신 커밋 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    # 동시성 테스트용 Postgres.
    # 검증 대상이 비관적 락인데 H2는 락 의미론이 달라 락을 떼도 통과할 수 있다.
    # 로컬에서는 Docker Desktop과 Testcontainers가 안 맞아 컨테이너를 직접 띄웠는데,
    # 여기서는 리눅스 러너라 services로 간단히 붙는다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ims
          POSTGRES_USER: ims
          POSTGRES_PASSWORD: ims
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U ims -d ims"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: 테스트 (H2)
        working-directory: backend
        run: ./gradlew test

      - name: 커버리지 게이트 (LINE 90% / BRANCH 80%)
        working-directory: backend
        run: ./gradlew jacocoTestCoverageVerification

      - name: 동시성 테스트 (실제 Postgres)
        working-directory: backend
        run: ./gradlew concurrencyTestPg

      # 실패했을 때 로그만 보고 원인을 찾기 어렵다. 리포트를 받아둔다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      # next build가 tsc를 포함한다. 타입 오류도 여기서 잡힌다
      - name: 빌드
        working-directory: frontend
        run: npm run build
