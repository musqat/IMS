plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ims'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-batch'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Swagger (springdoc-openapi)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// 동시성 테스트를 실제 Postgres에서 돌린다.
// 검증 대상이 비관적 락인데 H2는 MODE=PostgreSQL이어도 락 의미론이 다르다.
// 기본 test 태스크는 H2 그대로다.
//
//   docker compose up -d pgtest
//   ./gradlew concurrencyTestPg
tasks.register('concurrencyTestPg', Test) {
	group = 'verification'
	description = '동시성 테스트를 실제 Postgres에서 실행 (컨테이너를 미리 띄워야 한다)'
	// Test 타입을 새로 만들면 기본값이 없어 직접 지정해야 한다
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching '*InventoryConcurrencyTest*' }

	environment 'TEST_DB_URL', 'jdbc:postgresql://localhost:5442/ims'
	environment 'TEST_DB_DRIVER', 'org.postgresql.Driver'
	environment 'TEST_DB_USER', 'ims'
	environment 'TEST_DB_PASSWORD', 'ims'
	environment 'TEST_DB_DIALECT', 'org.hibernate.dialect.PostgreSQLDialect'
}

// 커버리지에서 제외할 대상.
// DTO/엔티티/설정은 로직이 없거나 롬복 생성 코드라 수치만 부풀린다.
def jacocoExcludes = [
		'**/ImsApplication*',
		'**/dto/**',
		'**/entity/**',
		'**/*Request*',
		'**/*Response*',
		'**/config/**',
]

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}

// 커버리지 하한선. 현재 수치(라인 92.2% / 브랜치 84.3%)보다 조금 낮게 잡아
// 회귀만 막는다. 수치를 올리는 것이 목적이 아니라 떨어뜨리지 않는 것이 목적이다.
jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.90
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.80
			}
		}
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
}
