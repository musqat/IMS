# =============================================================================
# 운영 프로파일 (Render + Supabase Postgres + Upstash Redis)
# 활성화: SPRING_PROFILES_ACTIVE=prod
#
# 필수 환경변수 (기본값 없음 — 미주입 시 부팅 실패)
#   DB_HOST DB_USERNAME DB_PASSWORD
#   REDIS_HOST REDIS_PASSWORD
#   JWT_SECRET CORS_ALLOWED_ORIGINS
#
# Supabase 접속 주의
#   - Direct connection(db.<ref>.supabase.co:5432)은 IPv6 전용이라 Render에서 못 쓴다.
#     반드시 Supavisor 풀러 호스트(aws-0-<region>.pooler.supabase.com)를 쓴다.
#   - 풀러는 두 모드가 있다.
#       5432 = session mode   → JDBC/Batch와 궁합이 좋다. 기본값으로 쓴다.
#       6543 = transaction mode → prepared statement가 깨진다.
#                                 굳이 쓸 거면 DB_PREPARE_THRESHOLD=0 으로 껐다.
#   - 사용자명은 postgres.<project-ref> 형식이다. 접두사를 빼면 인증이 실패한다.
# =============================================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}&prepareThreshold=${DB_PREPARE_THRESHOLD:5}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # 풀러가 유휴 커넥션을 조용히 끊어도 죽은 커넥션을 잡지 않도록 짧게 유지한다.
      max-lifetime: 1200000        # 20분
      keepalive-time: 300000       # 5분마다 유휴 커넥션 검증
      idle-timeout: 600000         # 10분
      connection-timeout: 30000
      # Render Free = 512MB, Supabase 무료 풀러도 커넥션이 넉넉하지 않다.
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 5000
      ssl:
        enabled: ${REDIS_SSL:true}   # Upstash는 TLS 필수

  batch:
    job:
      enabled: false                 # 스케줄러가 트리거. 부팅 시 자동 실행 금지
    jdbc:
      initialize-schema: always      # 배치 메타 테이블 자동 생성

server:
  port: ${PORT:8080}                 # Render가 PORT를 주입한다
  forward-headers-strategy: framework # 프록시 뒤 HTTPS 스킴 인식
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 3600000
  refresh-token-expiry: 1209600000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 데모용으로 Swagger 노출 유지
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.ims: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
